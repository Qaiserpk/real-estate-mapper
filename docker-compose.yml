services:
  db:
    image: postgis/postgis:16-3.4
    container_name: propmap_db
    environment:
      POSTGRES_USER: propmap
      POSTGRES_PASSWORD: propmap
      POSTGRES_DB: propmap
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propmap -d propmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: propmap_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://propmap:propmap@db:5432/propmap
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
